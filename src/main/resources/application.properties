spring.application.name=propflow-api
server.port=${PORT:8080}

# Active profile. "dev" is the default for local development; deployments set
# SPRING_PROFILES_ACTIVE explicitly.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Datasource -------------------------------------------------------------
# Supplied by the environment. The defaults below are deliberately non-secret
# and point at the local Docker Compose database (see docker-compose.yml and
# .env.example). Never put a real credential in this file -- it is tracked.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/propflow}
spring.datasource.username=${DB_USERNAME:propflow}
spring.datasource.password=${DB_PASSWORD:propflow}

# --- Schema migrations ------------------------------------------------------
# Flyway owns the schema. Migrations run automatically at startup, in version
# order, and are checksummed -- editing an applied migration is an error rather
# than a silent divergence.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate is deliberately NOT enabled. On a database that already
# has tables but no flyway_schema_history, Flyway should fail loudly rather
# than assume the existing schema matches V1. Recreate such a database with
# `docker compose down -v`.

# --- JPA / Hibernate --------------------------------------------------------
# validate, not update: Hibernate checks that the entity mappings match the
# schema Flyway produced and refuses to start if they have drifted. This turns
# a class of silent runtime bug into an immediate, obvious boot failure.
# Hibernate must never modify the schema -- that is Flyway's job alone.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.isolation=READ_COMMITTED

# Disables the Open Session In View anti-pattern. With OSIV enabled (the Spring
# Boot default) the persistence context stays open for the whole request, which
# hides lazy-loading mistakes and holds a connection longer than necessary.
# Disabled, they surface at the service boundary where they belong.
spring.jpa.open-in-view=false

# --- Security ---------------------------------------------------------------
# JWT signing key. Supplied by the environment with NO fallback: a default
# signing key would let anyone with the source forge a token for any account,
# so the application refuses to start without it. Generate one with:
#     openssl rand -base64 48
propflow.jwt.secret=${JWT_SECRET}
# Short-lived by design. A stateless token cannot be revoked before it expires,
# so its lifetime is the ceiling on how long a compromised token stays useful.
propflow.jwt.expiration=${JWT_EXPIRATION:1h}

# Browser origins permitted to call the API. Wildcards are rejected at startup.
propflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://prop-flow-ui.vercel.app}

# --- Pagination -------------------------------------------------------------
# Hard ceiling on page size. Without it a client can request ?size=1000000 and
# turn a paginated endpoint back into an unbounded one -- the failure mode
# pagination exists to prevent.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# --- Logging ----------------------------------------------------------------
# INFO by default. The dev profile raises application logging to DEBUG.
logging.level.root=INFO
logging.level.com.hoseacodes.propflow=INFO
