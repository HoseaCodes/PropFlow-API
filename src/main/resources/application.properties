spring.application.name=propflow-api
server.port=${PORT:8080}

# Active profile. "dev" is the default for local development; deployments set
# SPRING_PROFILES_ACTIVE explicitly.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Datasource -------------------------------------------------------------
# Supplied by the environment. The defaults below are deliberately non-secret
# and point at the local Docker Compose database (see docker-compose.yml and
# .env.example). Never put a real credential in this file -- it is tracked.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/propflow}
spring.datasource.username=${DB_USERNAME:propflow}
spring.datasource.password=${DB_PASSWORD:propflow}

# --- JPA / Hibernate --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.isolation=READ_COMMITTED

# Disables the Open Session In View anti-pattern. With OSIV enabled (the Spring
# Boot default) the persistence context stays open for the whole request, which
# hides lazy-loading mistakes and holds a connection longer than necessary.
# Disabled, they surface at the service boundary where they belong.
spring.jpa.open-in-view=false

# --- Logging ----------------------------------------------------------------
# INFO by default. The dev profile raises application logging to DEBUG.
logging.level.root=INFO
logging.level.com.hoseacodes.propflow=INFO
