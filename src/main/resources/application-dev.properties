# Development profile: shared, non-secret local defaults.
# Secrets belong in .env (untracked) -- see .env.example.

# Verbose application logging while developing. Deliberately scoped to this
# project's package rather than root: setting root to DEBUG turns on DEBUG for
# every library on the classpath, which produces so much output that real
# diagnostics become unfindable.
logging.level.com.airbnb=DEBUG

# Spring Security and Spring Web are intentionally NOT set to DEBUG here.
# org.springframework.web at DEBUG can log request headers, which would include
# the Authorization header once bearer-token authentication is in place.
# Enable them ad hoc when debugging a specific problem, not by default.

# SQL logging stays off. show-sql writes unformatted statements to stdout with
# no timings, which is not observability. Use Hibernate statistics or
# pg_stat_statements when investigating query behaviour.
spring.jpa.show-sql=false
