# Test profile. The datasource is supplied by the Testcontainers PostgreSQL
# instance via @ServiceConnection, so no connection settings appear here.

# Flyway builds the schema on the fresh container, exactly as it does in a real
# environment. Hibernate then validates its mappings against that schema, so a
# mismatch between an entity and a migration fails the test run rather than
# reaching production.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Signing key for tests only. This is not a secret: it exists so the test suite
# runs without an ambient JWT_SECRET, and it never reaches a deployed
# environment because this file lives under src/test.
propflow.jwt.secret=integration-test-signing-key-not-a-secret-32b+
propflow.jwt.expiration=1h

propflow.cors.allowed-origins=http://localhost:4200

# Keep test output readable. Raise these locally when diagnosing a failure.
logging.level.root=WARN
logging.level.com.hoseacodes.propflow=INFO
logging.level.org.flywaydb=INFO
spring.jpa.show-sql=false
