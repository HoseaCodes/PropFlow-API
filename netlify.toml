# Alternative host. GitHub Pages is the default (.github/workflows/docs.yml);
# this exists so switching is a two-minute change rather than a rewrite.
#
# They are alternatives, not layers -- both serve the same static output from
# `mkdocs build`. Pick one. Pages is preferred here because it needs no
# third-party account and lives alongside the code.
#
# To use Netlify instead: connect the repo, and set the build to run
# `./mvnw verify` first so docs/api/openapi.json exists. Netlify's build image
# includes Java and Maven, but the integration tests need Docker, which Netlify
# does not provide -- so on Netlify the spec must either be committed or
# generated by a CI job that uploads it. That constraint is the main reason
# Pages is the better fit here.

[build]
  publish = "site"
  command = "pip install -r requirements-docs.txt && mkdocs build --strict"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
